name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - name: Package installs and runs from a clean directory
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/semantic-diff-*.tgz
          npx semantic-diff --version
          npx semantic-diff-mcp </dev/null
      - name: Benchmark (informational)
        run: npm run bench

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test
        shell: bash
        run: |
          code=0
          npm test >test.log 2>&1 || code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            # Job logs need admin rights to read; annotations are public, so surface failures there.
            summary=$(grep -A40 'failing tests' test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failures::${summary}"
          fi
          exit "$code"

  test-windows:
    name: Test (windows-latest, experimental)
    runs-on: windows-latest
    # Not verified on Windows yet; failures are reported without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test
        shell: bash
        run: |
          code=0
          npm test >test.log 2>&1 || code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            # Job logs need admin rights to read; annotations are public, so surface failures there.
            summary=$(grep -A40 'failing tests' test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failures::${summary}"
          fi
          exit "$code"
